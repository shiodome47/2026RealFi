    スライドの図表そのものは扱わず、音声で読み上げられた内容だけを記録している。
    発表者自身が「スライドは LLM で作ったので、割り引いて聞いてほしい」と断っている。

# 話者ラベル・タイムスタンプのない生テキストから文脈で話者を推定している。
speaker_labels: inferred
