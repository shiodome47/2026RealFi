#    日本語全文とまとめは CIO に直し、英語全文は原文のまま。
#
# 3. **Howie は途中から別の名前で呼ばれている**（紹介では 4 回、後半では 4 回）。
#    本人は名乗っていない。**進行役が別の場で挙げた出席者の並び
