  note: |
    **1〜4 枚目は依頼者の確認が取れたので反映した。**ページでは
    CLAUDE.md 4-b の `スライド` バッジを付けて、音声と出典を分けてある。

      1. ASSET MIX — 3 つのスリーブの役割の定義
      2. INVESTMENT SOURCING — 案件発掘からモニタリングまでの 4 段階
      3. STABILITY — 防御の順序と、セーフティ・オプション
      4. STRESS TEST — 何に対して検証したか

    **これら 4 枚には、利回りや収益の予測にあたる数字が 1 つも入っていない。**
    入っているのは工程の番号（1〜4）と「2 ノッチの格下げ」程度。
    **配分の比率（45% / 25% / 50%）はスライドではなく音声で語られたもの。**

    **5 枚目（付録の数値例）は載せない。**理由は 2 つ。

      1. **フッターに「Confidential」の表示がある**（ほかの 4 枚は「Proprietary」）。
      2. **中身が仮定にもとづく数値例**（残高、カバレッジ比率、ヘアカット率など）。
         **仮定を積み上げた数字は、切り出すと仮定が落ちて、実績や予測に見える。**

    構造の部分（ウォーターフォールの順序、8 日目、待ち行列ゼロ、
    スリーブ C の売却ゼロ）は**音声でも語られている**ので、
    **音声を出典として**書いてある。

