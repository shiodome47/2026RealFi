# 画面に映っていて口に出されなかった数字には `スライド` のマークを付ける。数値はすべて 2026-10-27 時点。
slides:
  shown: true
  received: 10                # 1 枚目（表紙）と TVL チャートの枚は受け取っていない
  published: redrawn_only
  note: |
    受け取った枚: 2 前提 / 3 Part 1 扉 / 5 累積の小口流入 / 6 プールの両側 / 7 Part 2 扉 /
    8 venue 別の積み上げ / 9 出どころ別の流れ（サンキー）/ 10 戦略のランキング / 11 まとめ。
    「Confidential」「Proprietary」の表示はどの枚にもない。話者も「独占的なものは何もない」
    「ツイートしても問題ない」と述べている。

